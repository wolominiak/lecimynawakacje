# Zdjęcia krajów i regionów z Pixabay (albo Pexels).
# Wymaga sekretu PIXABAY_API_KEY (klucz widać na https://pixabay.com/api/docs/ po zalogowaniu).
# Ręcznie: Actions -> "Pobierz zdjęcia" -> Run workflow. Raz dziennie dociąga brakujące (np. nowe regiony).
name: Pobierz zdjęcia

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: 'countries, regions albo all'
        default: 'all'
      only:
        description: 'Tylko te klucze (np. grecja,grecja-kreta), puste = brakujące'
        default: ''
      force:
        description: 'Podmień istniejące zdjęcia (true/false)'
        default: 'false'
      limit:
        description: 'Ile zdjęć w jednej rundzie'
        default: '2000'

permissions:
  contents: write

concurrency:
  group: fetch-photos
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Sprawdź klucz
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ -z "$PIXABAY_API_KEY$PEXELS_API_KEY" ]; then
            echo "::warning::Brak sekretu PIXABAY_API_KEY. Dodaj go w Settings -> Secrets and variables -> Actions."
            exit 0
          fi
          echo "HAS_KEY=1" >> $GITHUB_ENV
      - name: Instaluj zależności
        if: env.HAS_KEY == '1'
        run: npm ci --no-audit --no-fund
      - name: Pobierz
        if: env.HAS_KEY == '1'
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          ARGS="--scope ${{ inputs.scope || 'all' }} --limit ${{ inputs.limit || '2000' }}"
          if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only ${{ inputs.only }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          node scripts/fetch-photos.mjs $ARGS
      - name: Commit i push
        if: env.HAS_KEY == '1'
        run: |
          git config user.name "wolominiak"
          git config user.email "228559845+wolominiak@users.noreply.github.com"
          git add public/img data/photos.json
          if git diff --cached --quiet; then echo "Brak nowych zdjęć"; exit 0; fi
          git commit -m "Nowe zdjęcia"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
