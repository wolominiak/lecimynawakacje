name: probe-sylwester
on:
  push:
    paths: ['scripts/probe-sylwester.mjs']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/probe-sylwester.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/probe-sylwester.json
          git commit -m "probe sylwester [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
