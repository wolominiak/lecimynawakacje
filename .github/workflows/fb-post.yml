# Posty na fanpage lecimynawakacje: 8:30, 12:30 i 19:30 czasu polskiego.
# Cron jest w UTC, dlatego uruchamia się w dwóch porach (czas zimowy i letni); skrypt sam pilnuje okna i nie publikuje dwa razy.
# Wymaga sekretów FB_PAGE_TOKEN i FB_PAGE_ID. Bez nich działa na sucho (tylko wypisuje post w logu).
name: Posty na Facebooka

on:
  schedule:
    - cron: '30 6,7,10,11,17,18 * * *'
  workflow_dispatch:
    inputs:
      typ:
        description: 'Rodzaj posta (auto = według pory dnia i slotu)'
        type: choice
        default: auto
        options:
          - auto
          - oferta-dnia
          - oferta-all-inclusive
          - last-minute-lista
          - last-minute-weekend
          - all-inclusive-lista
          - tanie-loty
          - tanie-loty-miasto
          - egzotyka
          - rejsy
          - hotel
          - hotel-dla-rodzin
          - atrakcja
          - region
          - kraj
          - gdzie-jechac
      slot:
        description: 'Tylko dla typu auto: wymuś slot rano, poludnie, wieczor (puste = według godziny)'
        default: ''
      dry:
        description: 'Tylko podgląd w logu, bez publikacji'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fb-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Publikuj
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.typ }}" ] && [ "${{ inputs.typ }}" != "auto" ]; then ARGS="$ARGS --type ${{ inputs.typ }}"; fi
          if [ -n "${{ inputs.slot }}" ]; then ARGS="$ARGS --slot ${{ inputs.slot }}"; fi
          if [ "${{ inputs.dry }}" = "true" ]; then ARGS="$ARGS --dry"; fi
          npx --yes tsx scripts/fb-post.ts $ARGS
      - name: Zapisz historię postów
        run: |
          git config user.name "wolominiak"
          git config user.email "228559845+wolominiak@users.noreply.github.com"
          git add data/fb-posted.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Facebook: historia postów [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
