# Generowanie przewodników przez Gemini z poziomu GitHuba:
# Actions -> "Generuj przewodniki" -> Run workflow.
# Wymaga sekretu repozytorium GEMINI_API_KEY (Settings -> Secrets and variables -> Actions).
name: Generuj przewodniki

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Ile krajów wygenerować'
        default: '20'
      only:
        description: 'Tylko te slugi (np. islandia,norwegia), puste = kolejne brakujące'
        default: ''
      force:
        description: 'Nadpisz istniejące pliki Gemini (true/false)'
        default: 'false'
      model:
        description: 'Model Gemini'
        default: 'gemini-2.5-flash'

permissions:
  contents: write

concurrency:
  group: generate-content
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sprawdź klucz Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Brak sekretu GEMINI_API_KEY. Dodaj go w Settings -> Secrets and variables -> Actions."
            exit 1
          fi
      - name: Generuj
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.model }}
        run: |
          ARGS="--limit ${{ inputs.limit }}"
          if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only ${{ inputs.only }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          node scripts/generate-content.mjs $ARGS
      - name: Sprawdź myślniki
        run: node scripts/check-dashes.mjs
      - name: Commit i push
        run: |
          # Autor = konto wolominiak, inaczej Vercel zablokuje deploy
          git config user.name "wolominiak"
          git config user.email "228559845+wolominiak@users.noreply.github.com"
          git add content/countries
          if git diff --cached --quiet; then echo "Brak nowych plików"; exit 0; fi
          git commit -m "Nowe przewodniki (Gemini)"
          # main mogło się zmienić w trakcie generowania
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
